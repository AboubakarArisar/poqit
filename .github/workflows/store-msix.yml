name: Store MSIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Install Rust MSVC target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Build Store submission package
        shell: powershell
        run: .\scripts\package-store.ps1
      - name: Upload unsigned MSIX for Partner Center
        uses: actions/upload-artifact@v7
        with:
          name: poqit-store-msix
          path: outputs/*.msix
          if-no-files-found: error
          retention-days: 7
